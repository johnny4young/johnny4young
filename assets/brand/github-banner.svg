<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Johnny IV Young — Senior Backend and AI Engineer">
  <defs>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0 H0 V72" fill="none" stroke="#1f2937" stroke-width="1" opacity="0.55"/>
    </pattern>
    <radialGradient id="glow" cx="78%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#67e8f9" stop-opacity="0"/>
    </radialGradient>
    <style>
      .mono { font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
      .sans { font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif; }
    </style>
  </defs>

  <!-- surface + signature grid -->
  <rect width="1280" height="320" fill="#0c1017"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <rect width="1280" height="320" fill="url(#glow)"/>
  <rect x="0" y="0" width="1280" height="4" fill="#67e8f9" opacity="0.9"/>

  <!-- eyebrow -->
  <text x="72" y="86" class="mono" font-size="20" letter-spacing="1" fill="#6b7280">// senior backend · ai engineering · developer tooling</text>

  <!-- wordmark: Johnny IV Young (IV in accent cyan) -->
  <text x="70" y="178" class="sans" font-size="88" font-weight="800" letter-spacing="-3">
    <tspan fill="#e5e7eb">Johnny </tspan><tspan fill="#67e8f9">IV</tspan><tspan fill="#e5e7eb"> Young</tspan>
  </text>

  <!-- tagline -->
  <text x="72" y="228" class="sans" font-size="26" font-weight="500" fill="#9ca3af">Backends that survive real traffic. AI systems that actually ship.</text>

  <!-- terminal line -->
  <text x="72" y="276" class="mono" font-size="22" fill="#6b7280"><tspan fill="#67e8f9">$</tspan> cd ~/medellin <tspan fill="#6b7280">&amp;&amp;</tspan> ship</text>

  <!-- ~/iv terminal pill mark -->
  <g transform="translate(965 114)">
    <rect x="0.5" y="0.5" width="247" height="92" rx="16" fill="#080b11" stroke="#1f2937"/>
    <text x="30" y="62" class="mono" font-size="52" font-weight="700" letter-spacing="-2"><tspan fill="#6b7280">~/</tspan><tspan fill="#e5e7eb">iv</tspan></text>
    <rect x="182" y="29" width="24" height="40" rx="3" fill="#67e8f9">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
